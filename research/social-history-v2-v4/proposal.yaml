# ---------------------------------------------------------------------------
# 三、要让这份数据可加载，需要先做的登记（本次不改 edge-signatures.yaml）
# ---------------------------------------------------------------------------
schema_requirements:

  node_classes:
    - { abbr: ORG, prefix: "ORG:", pattern: "^ORG:[a-z0-9][a-z0-9.-]*$", label: 机构, required_fields: [org_kind, founded_year, place] }
    - { abbr: JRN, prefix: "JRN:", pattern: "^JRN:[a-z0-9][a-z0-9.-]*$", label: 期刊／丛书, required_fields: [journal_kind, founded_year, place] }

  edges:
    - type: member_of
      from: [person]
      to: [org]
      attributes:
        role: { required: true, enum: [member, fellow, president, foreign-member, corresponding-member] }
    - type: employed_by
      from: [person]
      to: [org]
      attributes:
        role: { required: true, enum: [professor, lecturer, assistant, privatdozent, director] }
    - type: publishes_in
      from: [person]
      to: [journal]
      gloss: "人物级发表渠道；不代替具体篇目的 text→journal 书目边"
      attributes:
        role: { required: true, enum: [principal_channel, contributor, editor] }

  constraints:
    - "三条边均必带 time.from / time.to；缺失即 error"
    - "禁止自环；member_of 与 employed_by 可并存（身份不同）"
    - "publishes_in 不是书目证据：具体篇目仍须 text→journal 的 published_in 边（尚未登记）"
    - "本条数据未进 samples/ 与 pilots/，避免 graphlint v0.2 check-all 误报"

  registration_steps:
    - "在 spec/framework/edge-signatures.yaml 增加 node_classes 与 3 条 edges"
    - "cd tools && py -3 -m graphlint generate"
    - "cd tools && py -3 -m graphlint check-all"
    - "通过后再把本文件拆成 nodes.json / edges.json 迁入 samples/ 或独立图包"
